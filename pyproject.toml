[project]
name = "depbee-analyzer"
version = "0.1.0"
description = "npm package update pair로부터 feature를 추출해 dataset을 만드는 개발용 도구 (최종 사용자 CLI 아님)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "semver>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
depbee-analyzer = "depbee_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
